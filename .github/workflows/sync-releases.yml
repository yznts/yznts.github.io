name: Sync releases

# Rebuilds data/releases/*.json from the GitHub releases listed in
# data/releases-sources.json, then asks the Pages workflow to redeploy.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the
# deploy is dispatched explicitly rather than left to the push event.

on:
  # Sent by a project's release workflow, for an immediate update.
  repository_dispatch:
    types: [release-published]
  # A safety net, in case the dispatch never arrives.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    name: Sync release data
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync-releases.sh

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/releases; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "release data is already up to date"
            exit 0
          fi
          git add data/releases
          git commit -m "chore: sync release data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hugo.yml --ref main
