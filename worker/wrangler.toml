name = "yznts-downloads"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The route sits on the site's own domain, so downloads never leave it.
# Everything else on yznts.cc keeps coming from GitHub Pages.
routes = [
  { pattern = "yznts.cc/dl/*", zone_name = "yznts.cc" }
]

# GITHUB_TOKEN is a secret, set with:
#   npx wrangler secret put GITHUB_TOKEN
