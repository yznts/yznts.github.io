server {
  listen 80;
  server_name _;
  root /srv;

  # No listing: the download pages link every file by name, and an index
  # would expose builds that are not announced yet.
  autoindex off;

  # A published build never changes, and its path carries the version.
  location / {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  # Everything here is meant to be saved, not rendered. Types nginx does
  # not know would otherwise be served as octet-stream anyway, which is
  # what we want, but naming them keeps the headers honest.
  types {
    application/x-apple-diskimage      dmg;
    application/vnd.debian.binary-package deb;
    application/zip                    zip;
    application/gzip                   gz tgz;
    application/zstd                   zst;
    application/x-msdownload           exe;
    application/x-msi                  msi;
    text/plain                         txt sha256;
  }
  default_type application/octet-stream;

  # A health probe that does not depend on any file being published.
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
